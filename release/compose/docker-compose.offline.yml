services:
  backend:
    image: rah-healthcare-backend:${RELEASE_VERSION:-1.0.2}
    container_name: healthcare-backend
    restart: unless-stopped
    ports:
      # External 8001 matches the hardcoded fallback in
      # frontend/src/config/api.js (`${hostname}:8001`). If you change this,
      # you must also set an explicit apiBaseUrl in
      # frontend/public/config.json and rebuild+reload the frontend image.
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - ENVIRONMENT=offline
      - ENABLE_AI=${ENABLE_AI:-false}
    volumes:
      - ${STORAGE_ROOT:-./storage}/app-storage:/app/storage
      - ${STORAGE_ROOT:-./storage}/root-storage:/storage
      - ${STORAGE_ROOT:-./storage}/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: rah-healthcare-frontend:${RELEASE_VERSION:-1.0.2}
    container_name: healthcare-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
