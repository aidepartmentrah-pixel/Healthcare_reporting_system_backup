server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html or config.json: config.json is fetched
    # synchronously at page load to determine the API host at runtime
    # (see frontend/src/config/api.js). Stale caching here would undo
    # the LAN-access fix these files exist for.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
